name: Release Codex Beacon

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Test native app
        run: swift test

      - name: Test npm installer
        run: npm test --prefix npm

      - name: Assemble distribution artifacts
        run: |
          ./scripts/build-dmg.sh
          npm pack ./npm

      - name: Create GitHub Release
        if: github.event_name == 'push'
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            notes_file="docs/releases/${GITHUB_REF_NAME}.md"
            release_args=(
              "$GITHUB_REF_NAME"
              dist/CodexBeacon-*-arm64.dmg
              lindengjian-codex-beacon-*.tgz
            )
            if [[ -f "$notes_file" ]]; then
              release_args+=(--notes-file "$notes_file")
            else
              release_args+=(--generate-notes)
            fi
            gh release create "${release_args[@]}"
          fi

      - name: Publish npm package
        if: env.NODE_AUTH_TOKEN != '' && github.event_name == 'push'
        run: npm publish ./npm --provenance
